name: Broken card
description: A wrong install command, a dead example link, a stale model name or a license error on a card.
title: "[card] "
labels: [card]
body:
  - type: input
    id: card
    attributes: { label: Card URL, placeholder: https://varg.ai/how-to/skills/<slug> }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What is wrong, and what it should say }
    validations: { required: true }
  - type: input
    id: agent
    attributes: { label: Agent and version you tried it in, placeholder: Claude Code 2.1 on macOS }
